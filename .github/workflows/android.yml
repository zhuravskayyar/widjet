name: Android APK and updates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Restore the existing app signing identity
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SIGNING_KEY_B64: ${{ secrets.STONE_CLOCK_KEYSTORE_B64 }}
        shell: bash
        run: |
          test -n "$SIGNING_KEY_B64" || { echo 'STONE_CLOCK_KEYSTORE_B64 is missing'; exit 1; }
          signing_path="$RUNNER_TEMP/stone-clock.keystore"
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$signing_path"
          chmod 600 "$signing_path"
          fingerprint=$(keytool -list -v -keystore "$signing_path" -alias AndroidDebugKey -storepass android \
            | awk '/SHA256:/ {print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$fingerprint" = '42ad4b2d98d91cf8b1e10825160b3566ce364def2901323f370e49e6a844a595' \
            || { echo 'Signing certificate does not match the installed app'; exit 1; }
          echo "STONE_CLOCK_KEYSTORE_PATH=$signing_path" >> "$GITHUB_ENV"
      - name: Build APK and check Android lint
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:lintDebug --console=plain \
            -PappVersionCode="$((100 + GITHUB_RUN_NUMBER))" \
            -PappVersionName="0.4.${GITHUB_RUN_NUMBER}"
      - name: Prepare update metadata
        run: python3 scripts/prepare_release.py
      - name: Upload APK and metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stone-clock-release
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the signed APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stone-clock-release
          path: release
      - name: Publish a version for wireless app updates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v0.4.${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/stone-clock.apk release/update.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release/stone-clock.apk release/update.json \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
              --title "Stone Clock ${tag}" --notes-file release/notes.md
          fi
